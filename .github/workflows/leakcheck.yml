name: Leak Check

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: "The commit to check out at. Defaults to the parent workflow's github.sha."
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.sha }}

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Install lld (Linux)
      run: sudo apt-get update && sudo apt-get install -y lld

    - name: Set Up Workspace
      # Submodules shouldn't cause a download.
      env:
        GOPRIVATE: github.com/zninggo/v8go
        GOSUMDB: off
        GONOSUMCHECK: github.com/zninggo/v8go
      run: |
        set -o pipefail
        go work init . $(ls ./deps/*_*/cgo.go | xargs -r dirname)

    - name: Build Test
      env:
        CC: clang
        CXX: clang++
        GOPRIVATE: github.com/zninggo/v8go
        GOSUMDB: off
        GONOSUMCHECK: github.com/zninggo/v8go
        CGO_LDFLAGS_ALLOW: "-fuse-ld=.*"
      run: |
        go test -c --tags leakcheck

    - name: Run Test
      run: ./v8go.test
